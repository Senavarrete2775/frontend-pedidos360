<header class="app-navbar">
  <div class="navbar-container">
    <div class="brand">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
        </svg>
      </div>
      <div>
        <span class="brand-name">Pedidos360</span>
        <span class="brand-tag">Cloud Native</span>
      </div>
    </div>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Inicio</a>
      <a routerLink="/pedidos" routerLinkActive="active" class="nav-link">
        Pedidos
        <span class="nav-shield" title="Ruta protegida con MsalGuard">🔒 Guard</span>
      </a>
    </nav>

    <div class="auth-actions">
      <div *ngIf="isLoggedIn" class="user-pill">
        <span class="online-dot"></span>
        <span class="user-email">{{ usuario?.name || usuario?.username }}</span>
        <button class="btn-logout" (click)="logout()">Salir</button>
      </div>

      <div *ngIf="!isLoggedIn">
        <button class="btn-login-ms" (click)="login()">
          <svg width="16" height="16" viewBox="0 0 23 23">
            <path fill="#f35325" d="M1 1h10v10H1z"/>
            <path fill="#81bc06" d="M12 1h10v10H12z"/>
            <path fill="#05a6f0" d="M1 12h10v10H1z"/>
            <path fill="#ffba08" d="M12 12h10v10H12z"/>
          </svg>
          Iniciar Sesión
        </button>
      </div>
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <div class="footer-container">
    <span>DSY1107 - Desarrollo Cloud Native I &bull; Duoc UC &bull; Evaluación Parcial N° 1</span>
    <span class="tech-stack">Angular + MSAL &bull; Spring Boot en EC2 &bull; Azure AD</span>
  </div>
</footer>
