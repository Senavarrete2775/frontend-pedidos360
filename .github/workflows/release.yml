name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verificar que el tag coincide con package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con package.json ($VERSION)"; exit 1
          fi
      - run: npm ci
      - run: npx ng build
      - name: Empaquetar
        run: tar czf "frontend-pedidos360-$GITHUB_REF_NAME.tar.gz" -C dist .
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" frontend-pedidos360-*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
